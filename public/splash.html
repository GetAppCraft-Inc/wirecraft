<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WireCraft</title>
    <style>
      /* Shown while the proxy and the interface start. Colours are the design tokens (design/generator/lib.py). */
      :root {
        --bg: #111418;
        --edge: #262c35;
        --text: #e6e9ee;
        --muted: #a1aab6;
        --faint: #6a737f;
        --accent: #8b93ff;
        --track: #1e232a;
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --edge: #d5dae1;
        --text: #14171c;
        --muted: #4d5663;
        --faint: #8790a0;
        --accent: #4b52d6;
        --track: #e8ebef;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        border: 1px solid var(--edge);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22%;
        animation: rise 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.4px;
        margin-top: 4px;
      }
      h1 span {
        font-weight: 500;
        color: var(--muted);
      }
      p {
        color: var(--muted);
        font-size: 12.5px;
      }
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
        margin-top: 10px;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        text-align: center;
        font-size: 11px;
        color: var(--faint);
      }
      @keyframes slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        img,
        .bar i {
          animation: none;
        }
        .bar i {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <img src="/icon.svg" alt="" draggable="false" />
    <h1>Wire<span>Craft</span></h1>
    <p id="status">Starting the proxy…</p>
    <div class="bar" role="progressbar" aria-label="Starting"><i></i></div>
    <footer id="version"></footer>
    <script src="/splash.js"></script>
  </body>
</html>
