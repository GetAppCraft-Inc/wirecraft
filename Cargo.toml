[workspace]
resolver = "3"
members = ["crates/wirecraft-core", "src-tauri", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tanmaysinghx/xwire"

[workspace.dependencies]
wirecraft-core = { path = "crates/wirecraft-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
